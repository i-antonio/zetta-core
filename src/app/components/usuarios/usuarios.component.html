<div class="card">
  <h2>📝 Cadastrar Novo Usuário</h2>
  
  <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
  <div class="error" *ngIf="error">{{ error }}</div>
  
  <form #userForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nome">Nome:</label>
      <input 
        type="text" 
        id="nome" 
        name="nome"
        [(ngModel)]="newUsuario.nome" 
        required
        #nome="ngModel">
    </div>
    
    <div class="form-group">
      <label for="email">Email:</label>
      <input 
        type="email" 
        id="email" 
        name="email"
        [(ngModel)]="newUsuario.email" 
        required
        #email="ngModel">
    </div>
    
    <div class="form-group">
      <label for="telefone">Telefone:</label>
      <input 
        type="text" 
        id="telefone" 
        name="telefone"
        [(ngModel)]="newUsuario.telefone" 
        required
        #telefone="ngModel">
    </div>
    
    <div class="form-group">
      <label for="profissao">Profissão:</label>
      <input 
        type="text" 
        id="profissao" 
        name="profissao"
        [(ngModel)]="newUsuario.profissao" 
        required
        #profissao="ngModel">
    </div>
    
    <button type="submit" [disabled]="!userForm.form.valid">Adicionar Usuário</button>
  </form>
</div>

<div class="card">
  <h2>👥 Lista de Usuários</h2>
  
  <div class="controls">
    <button (click)="loadUsuarios()">🔄 Atualizar Lista</button>
  </div>
  
  <div class="loading" *ngIf="loading">Carregando...</div>
  
  <div class="empty-message" *ngIf="!loading && usuarios.length === 0">
    Nenhum usuário encontrado.
  </div>
  
  <div class="item-list" *ngIf="!loading && usuarios.length > 0">
    <div class="item" *ngFor="let usuario of usuarios">
      <p><strong>ID:</strong> {{ usuario.id }}</p>
      <p><strong>Nome:</strong> {{ usuario.nome }}</p>
      <p><strong>Email:</strong> {{ usuario.email }}</p>
      <p><strong>Telefone:</strong> {{ usuario.telefone }}</p>
      <p><strong>Profissão:</strong> {{ usuario.profissao }}</p>
      <button class="delete" (click)="deleteUsuario(usuario.id)">🗑️ Excluir</button>
    </div>
  </div>
</div>
